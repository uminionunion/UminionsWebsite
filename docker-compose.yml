services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      pantry-api:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: uminionmysql
      WORDPRESS_DB_USER: secret001
      WORDPRESS_DB_PASSWORD: secret002
      WORDPRESS_DB_NAME: secret003
    ports:
      - "4002:80"
    restart: always
    volumes:
      - /root/private-includes/includes:/var/www/html/includes
      - /root/private-includes/includes:/app/includes
      - /root/private-includes/StoreProductsAndImagery:/var/www/html/StoreProductsAndImagery
      - /root/private-includes/uploads:/var/www/html/uploads
      - /root/private-includes/uploadsSecondary:/var/www/html/uploadsSecondary
      - /root/private-includes/URTesting001:/var/www/html/URTesting001
    networks:
      - uminionnet

  pantry-api:
    build:
      context: ./pantry-api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DATA_DIRECTORY: /app/data
    volumes:
      - pantry_data:/app/data
    restart: always
    networks:
      - uminionnet
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/pantries"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pantry_data:

networks:
  uminionnet:
    external: true
