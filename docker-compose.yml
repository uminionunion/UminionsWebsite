services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      pantry-api:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped

  pantry-api:
    build:
      context: ./pantry-api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DATA_DIRECTORY: /app/data
    volumes:
      - pantry_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/pantries"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pantry_data:
