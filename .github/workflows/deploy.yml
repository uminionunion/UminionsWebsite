name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash -n scripts/deploy-vps.sh
      - run: node --test uhub-api/tests/deploy-vps.test.mjs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: production-vps
      cancel-in-progress: false
    steps:
      - name: Deploy uminionclassicv001 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -eu
            cd /docker/uminionclassicv001
            git fetch origin main
            deployment_script="$(mktemp)"
            trap 'rm -f "$deployment_script"' EXIT
            git show '${{ github.sha }}:scripts/deploy-vps.sh' > "$deployment_script"
            bash "$deployment_script" '${{ github.sha }}'
