name: Deploy to VPS

on:
  push:
    branches: [main] # or your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy uminionclassicv001 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd /docker/uminionclassicv001
            git pull
            if [ -f .env.migration ]; then
              docker compose --env-file .env.migration -f docker-compose.yml -f docker-compose.migration.yml build --no-cache
              docker compose --env-file .env.migration -f docker-compose.yml -f docker-compose.migration.yml up -d
            else
              docker compose down
              docker compose build --no-cache
              docker compose up -d
            fi
